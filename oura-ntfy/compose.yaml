services:
  app:
    build: .
    restart: unless-stopped
    init: true
    env_file: .env
    networks:
      - default
      - notifications
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - oura-data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
  caddy:
    image: caddy:2-alpine
    profiles: [https]
    restart: unless-stopped
    environment:
      - APP_DOMAIN=${APP_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
volumes:
  oura-data:
  caddy-data:
  caddy-config:

networks:
  notifications:
    external: true
    name: oura-notifications
